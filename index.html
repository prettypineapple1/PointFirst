<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Point First</title>
<meta name="description" content="Daily practice for clear speaking and writing.">
<meta name="theme-color" content="#F5F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1022" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Point First">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html{color-scheme:light;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@500&family=Figtree:wght@500;700;800&display=swap">
<style>
/* Layout: one narrow column. Identity is the highlighter: the point gets marked in yellow, everything else is ink on cool paper.
   Home = stat tags, progress panel, yellow next-up card, timeline path, plain practice rows. Lesson = thin progress line, inline feedback, sticky action bar. */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --ink:#0F1630; --muted:#59627D; --line:#D9DDE8;
  --hl:#FFE24A; --hl-soft:#FFF3B0; --on-hl:#0F1630;
  --good:#0B7A53; --good-bg:#DDF3EA; --bad:#BF3434; --bad-bg:#FCE4E2; --mark:#FFE24A;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1022; --surface:#151A33; --ink:#EDEFFA; --muted:#9AA2C0; --line:#2B3257;
    --hl:#FFD93D; --hl-soft:#3A3412; --on-hl:#0F1630;
    --good:#4DD3A0; --good-bg:#0F3328; --bad:#FF8F8F; --bad-bg:#3A1B1F; --mark:#7A6318;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1022; --surface:#151A33; --ink:#EDEFFA; --muted:#9AA2C0; --line:#2B3257;
  --hl:#FFD93D; --hl-soft:#3A3412; --on-hl:#0F1630;
  --good:#4DD3A0; --good-bg:#0F3328; --bad:#FF8F8F; --bad-bg:#3A1B1F; --mark:#7A6318;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg);color:var(--ink);font:500 16px/1.55 var(--font-body);
  padding-block:18px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body.inlesson{padding-bottom:0}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.wrap.lesson{min-height:calc(100vh - 18px);min-height:calc(100dvh - 18px)}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:800;line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(2rem,9vw,2.6rem)}
h2{font-size:1.4rem}
p{margin:0}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.9rem}
.mono,.eyebrow{font:500 .72rem/1.3 var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
.eyebrow{color:var(--muted)}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.hl{background:var(--hl);color:var(--on-hl);padding:0 .22em;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* home */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font:800 1.7rem/1 var(--font-display);letter-spacing:-.02em}
.tags{display:flex;gap:8px}
.tag{display:flex;align-items:baseline;gap:8px;border:2px solid var(--ink);border-radius:8px;padding:7px 10px;font:500 .72rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.tag b{font-size:1rem;font-weight:500;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:18px}
.meter{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.mrow .t{display:block;font:800 1.2rem/1.2 var(--font-display)}
.mrow .n{font:500 .85rem var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar,.prog{height:12px;background:var(--bg);border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.bar i,.prog i{display:block;height:100%;background:var(--hl)}
@media (prefers-reduced-motion:no-preference){.bar i,.prog i{transition:width .5s}}
.next{background:var(--hl);color:var(--on-hl);border:2px solid var(--on-hl);border-radius:14px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.next .l{display:flex;flex-direction:column;gap:4px;min-width:0}
.next .l b{font:800 1.25rem/1.2 var(--font-display)}
.next .eyebrow{color:var(--on-hl);opacity:.75}
.next .btn{background:var(--on-hl);color:var(--hl)}
.sec{display:flex;flex-direction:column;gap:12px}

.path{display:flex;flex-direction:column;gap:14px}
.uhead{display:flex;align-items:center;gap:14px;padding:6px 0}
.unum{flex:none;width:44px;height:44px;border:2px solid var(--ink);border-radius:10px;display:grid;place-items:center;font:800 1.5rem/1 var(--font-display)}
.unum.done{background:var(--hl);color:var(--on-hl);border-color:var(--on-hl)}
.ut{flex:1;min-width:0;display:flex;flex-direction:column}
.ut b{font:800 1.2rem/1.2 var(--font-display)}
.ut span{color:var(--muted);font-size:.9rem}
.up{color:var(--muted);font-variant-numeric:tabular-nums}
.rail{list-style:none;margin:0 0 0 21px;padding:0;border-left:2px solid var(--line)}
.rail li{position:relative}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px 12px 28px;background:none;border:0;border-radius:0 12px 12px 0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.lrow:hover{background:var(--surface)}
.lrow:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
.dotn{position:absolute;left:-10px;top:50%;margin-top:-9px;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);background:var(--bg);display:grid;place-items:center;color:var(--bg)}
.lrow.done .dotn{background:var(--ink)}
.lrow.cur{background:var(--hl-soft)}
.lrow.cur .dotn{background:var(--hl);box-shadow:0 0 0 4px var(--hl-soft)}
.lrow.lock .dotn{border-style:dashed;border-color:var(--muted)}
.ltxt{flex:1;min-width:0;display:flex;flex-direction:column}
.ltxt b{font-weight:800}
.ltxt span{color:var(--muted);font-size:.9rem}
.lrow.lock .ltxt b{color:var(--muted)}
.lst{flex:none;font:500 .72rem/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lst.go{background:var(--hl);color:var(--on-hl);padding:7px 10px;border-radius:6px}

.rows{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.prow:hover{border-color:var(--ink)}
.prow:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ptxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.ptxt b{font:800 1.15rem/1.2 var(--font-display)}
.ptxt .d{color:var(--muted);font-size:.95rem}
.pxp{flex:none;color:var(--muted);white-space:nowrap}

.trend{display:flex;align-items:flex-end;gap:8px;min-height:100px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.col .b{width:100%;max-width:36px;border-radius:4px 4px 0 0;background:var(--ink)}
.col .b.ok{background:var(--good)}
.col .v{font:500 .72rem/1 var(--font-mono);color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{border:2px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.bdg b{font:800 1rem/1.2 var(--font-display)}
.bdg .d{font-size:.85rem;color:var(--muted)}
.bdg .st{color:var(--muted)}
.bdg.on{border:2px solid var(--ink);background:var(--hl-soft)}
.bdg.on .st{color:var(--good)}
.foot{display:flex;flex-direction:column;gap:12px;font-size:.9rem;color:var(--muted)}

/* buttons */
.btn{font:800 1rem var(--font-body);min-height:50px;padding:0 22px;border-radius:10px;border:2px solid var(--on-hl);background:var(--hl);color:var(--on-hl);cursor:pointer}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn:disabled{background:var(--line);color:var(--muted);border-color:var(--line);cursor:not-allowed;filter:none;transform:none}
.btn:focus-visible,.quit:focus-visible,summary:focus-visible,textarea:focus-visible,.opt:focus-visible,.tok:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btns.col2{flex-direction:column}
.btns.col2 .btn{width:100%}

/* lesson shell */
.lhead{display:flex;flex-direction:column;gap:10px}
.ltop{display:flex;align-items:center;gap:14px}
.quit{display:flex;align-items:center;gap:6px;background:none;border:0;padding:6px 4px;color:var(--muted);font:700 .95rem var(--font-body);cursor:pointer;border-radius:8px}
.quit:hover{color:var(--ink)}
.prog{flex:1}
.rc{font:500 .8rem var(--font-mono);color:var(--muted);min-width:2.4em;text-align:right}
.ltitle{font-size:1.6rem}
.stepbody{display:flex;flex-direction:column;gap:16px}
.prompt{display:flex;flex-direction:column;gap:6px}
.lfoot{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:2px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:auto}
.lfoot .btn{width:100%}
.frow{display:flex;gap:10px}
.frow .btn{flex:1}

/* step types */
.teach{display:flex;flex-direction:column;gap:14px}
.tcard{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:1.05rem}
.eg{border-left:6px solid var(--good);background:var(--good-bg);border-radius:4px 10px 10px 4px;padding:10px 14px}
.eg.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.eg b{display:block;font:500 .72rem/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
.ctx{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.ctx b{display:block;font:500 .72rem/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.sent{font-size:1.2rem;font-weight:700;line-height:1.7}
.blank{display:inline-block;min-width:5.5em;text-align:center;padding:0 8px;background:var(--hl);color:var(--on-hl);border-radius:4px}
.opts,.pool{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:600 1rem/1.4 var(--font-body);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font:500 .8rem var(--font-mono);color:var(--muted)}
.opt.sel{border-color:var(--ink);background:var(--hl-soft)}
.opt.sel .k{border-color:var(--ink);background:var(--hl);color:var(--on-hl)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.slot{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;min-height:60px;border:2px dashed var(--line);border-radius:12px;padding:4px 6px 4px 10px}
.sn{font:500 .9rem var(--font-mono);color:var(--muted);text-align:center}
.slot .opt{padding:10px 12px}
.toks{display:flex;flex-wrap:wrap;gap:10px;line-height:1.2}
.tok{font:700 1.05rem var(--font-body);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.tok:hover:not(:disabled){border-color:var(--ink)}
.tok.sel{border-color:var(--ink);background:var(--hl);color:var(--on-hl)}
.tok.ok{border-color:var(--good);background:var(--good-bg)}
.tok.no{border-color:var(--bad);background:var(--bad-bg)}
.tok.miss{border-style:dashed;border-color:var(--ink);background:var(--hl-soft)}
.tok:disabled{cursor:default}
.hintbox{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
.hintbox summary{cursor:pointer;font-weight:800}
.hintbox p{margin-top:8px}
.tangle{margin:0;border-left:6px solid var(--bad);background:var(--bad-bg);border-radius:4px 10px 10px 4px;padding:12px 14px;font-size:1.05rem}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800}
textarea{font:500 1rem/1.5 var(--font-body);width:100%;min-height:84px;padding:12px 14px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;resize:vertical}
textarea:focus-visible{border-color:var(--ink)}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.clock{font:500 2.2rem/1 var(--font-mono);font-variant-numeric:tabular-nums;border:2px solid var(--ink);border-radius:10px;padding:8px 14px;background:var(--surface)}
.warn{border:2px solid var(--bad);border-radius:12px;padding:12px 14px;background:var(--bad-bg)}

/* inline feedback */
.fb{--fc:var(--ink);--fbg:var(--hl-soft);background:var(--fbg);border:2px solid var(--fc);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.fb.good{--fc:var(--good);--fbg:var(--good-bg)}
.fb.bad{--fc:var(--bad);--fbg:var(--bad-bg)}
@media (prefers-reduced-motion:no-preference){.fb{animation:rise .2s ease-out}@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}}
.fbh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fbh h3{font-size:1.35rem}
.fbi{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--fc);color:var(--bg)}
.fb.mid .fbi{background:var(--hl);color:var(--on-hl);border:2px solid var(--on-hl)}
.xpchip{margin-left:auto;font:500 .8rem var(--font-mono);background:var(--hl);color:var(--on-hl);padding:5px 8px;border-radius:6px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.cm{width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.cm.p{background:var(--good);color:var(--bg)}
.cm.f{background:var(--bad);color:var(--bg)}
.tip{display:block;font-weight:500;font-size:.92rem;color:var(--muted)}
.fb details{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);color:var(--ink)}
.fb summary{cursor:pointer;font-weight:800}
.fb details p+p{margin-top:8px}
.fb ol{margin:6px 0 0;padding-left:1.3em}
.fb .btns .btn{flex:1;min-width:130px}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:800 1.5rem/1.1 var(--font-display)}
.stat span{font-size:.82rem;color:var(--muted)}
.tx{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.9;overflow-wrap:anywhere}
mark.fill{background:var(--mark);color:var(--on-hl);padding:0 2px;border-radius:3px}
.long{text-decoration:underline wavy var(--bad);text-underline-offset:5px}
.callout{border-left:6px solid var(--bad);padding:2px 0 2px 12px}

/* done */
.done{display:flex;flex-direction:column;gap:20px;padding-top:12px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--surface)}
.cell{padding:16px 8px;text-align:center;display:flex;flex-direction:column;gap:4px}
.cell+.cell{border-left:2px solid var(--ink)}
.cell b{font:800 1.9rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.cell span{font:500 .68rem/1.3 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

#toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));max-width:608px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:700;z-index:30;text-align:center}
</style>

</head>
<body>
<main class="wrap" id="app"></main>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
// ==LOGIC==
const FILLER_RES=[
  ['um / uh',/\b(?:um+|uh+|uhm|er|ah)\b/gi],
  ['you know',/\byou know\b/gi],
  ['kind of / sort of',/\b(?:kind|sort) of\b/gi],
  ['I mean',/\bi mean\b/gi],
  ['I guess',/\bi guess\b/gi],
  ['I feel like',/\bi feel like\b/gi],
  ['basically',/\bbasically\b/gi],
  ['literally',/\bliterally\b/gi],
  ['actually',/\bactually\b/gi],
  ['honestly',/\bhonestly\b/gi],
  ['like (filler)',/\blike,|,\s*like\b/gi]
];
const HL_RE=new RegExp(FILLER_RES.map(function(x){return x[1].source}).join('|'),'gi');
const VAGUE=/\b(?:a lot|lots of|stuff|things?|good|bad|nice|great|very|really|many|various|whatever|somehow|something)\b/gi;
const NUMWORDS=/\b(?:two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|twenty|thirty|forty|fifty|hundred|thousand|half|dozen|twice)\b/gi;
const HEDGE=/^(?:so+|well|um+|uh+|like|i guess|i feel like|i think maybe|basically|honestly|kind of|sort of|i mean|you know|it'?s like|the thing is)\b/i;

function words(t){return String(t).match(/[a-z0-9$%]+(?:['’.\-][a-z0-9$%]+)*/gi)||[]}
function sentences(t){
  var s=String(t).replace(/[ \t\r]+/g,' ').replace(/\n+/g,'\u0001').replace(/([.!?]+)(\s+|$)/g,'$1\u0001');
  return s.split('\u0001').map(function(x){return x.trim()}).filter(Boolean);
}
function fillerStats(text){
  var by={},total=0;
  FILLER_RES.forEach(function(p){var m=String(text).match(p[1]);if(m){by[p[0]]=(by[p[0]]||0)+m.length;total+=m.length}});
  sentences(text).forEach(function(s){if(/^so+\b/i.test(s)){by['so (opening)']=(by['so (opening)']||0)+1;total++}});
  return {total:total,by:by};
}
function vagueList(t){return (String(t).match(VAGUE)||[]).map(function(x){return x.toLowerCase()})}
function specifics(t){
  t=String(t);
  var n=(t.match(/\d+(?:[.,:]\d+)*/g)||[]).length+(t.match(NUMWORDS)||[]).length;
  sentences(t).forEach(function(s){
    var rest=s.split(/\s+/).slice(1).join(' ');
    n+=(rest.match(/\b[A-Z][a-z]{2,}\b/g)||[]).length;
  });
  return n;
}
function storyish(t){return words(t).length>=10&&(String(t).match(/\b\w{3,}ed\b/gi)||[]).length>=2}
function flagged(t){
  var f=fillerStats(t),out=Object.keys(f.by);
  vagueList(t).forEach(function(w){if(out.indexOf(w)<0)out.push(w)});
  return out;
}

function checkPoint(p,r,e){
  var pw=words(p).length,ps=sentences(p).length,rw=words(r).length;
  var all=[p,r,e].join(' ');
  var bad=flagged(all);
  return [
    {ok:ps<=1&&pw>=4&&pw<=22,label:'Point is one short sentence',tip:'Yours is '+pw+' words'+(ps>1?' across '+ps+' sentences':'')+'. Aim for 4 to 22 words in one sentence.'},

function checkUntangle(text,item){
  var ss=sentences(text),lens=ss.map(function(s){return words(s).length});

  var low=text.toLowerCase();
  var hit=item.facts.filter(function(f){return new RegExp(f,'i').test(low)}).length;
  var need=Math.ceil(item.facts.length*0.75);
  var fl=fillerStats(text);
  return [
    {ok:ss.length>=2,label:'Split into separate sentences',tip:'You wrote '+ss.length+' sentence'+(ss.length===1?'':'s')+'. End each idea with a period.'},
    {ok:ss.length>0&&maxLen<=16,label:'Every sentence is 16 words or fewer',tip:'Your longest runs '+maxLen+' words. Split it again.'},
    {ok:commasOK,label:'No more than one comma per sentence',tip:'A second comma usually means a second idea. Give it its own sentence.'},
    {ok:hit>=need,label:'Keeps the key facts',tip:'You kept '+hit+' of '+item.facts.length+' facts. Reread the original for what you dropped.'},

function checkConcrete(text,item){

    {ok:wc>=6&&wc<=30,label:'Says something complete',tip:'You wrote '+wc+' words. Use 6 to 30 so the detail has room.'},

  ];
}
function analyzeTalk(text){
  var wc=words(text).length;
  if(wc>=20&&!/[.!?]/.test(text))return {needsPunct:true,wc:wc};
  var ss=sentences(text),lens=ss.map(function(s){return words(s).length});
  var longest=Math.max.apply(null,[0].concat(lens));
  var longestText=ss[lens.indexOf(longest)]||'';
  var avg=ss.length?wc/ss.length:0;
  var f=fillerStats(text),per100=wc?f.total/wc*100:0;
  var spec=specifics(text);
  var first=ss[0]||'',fw=words(first).length;
  var list=Object.keys(f.by).map(function(k){return k+' x'+f.by[k]}).join(', ');
  var checks=[
    {ok:wc>=40,label:'Enough to judge',tip:'You said '+wc+' words. A minute of talking is usually 100 or more.'},
    {ok:fw>=3&&fw<=22&&!HEDGE.test(first.trim()),label:'Led with the point',tip:HEDGE.test(first.trim())?'Your first sentence starts with a warm-up. Open with the answer.':'Your first sentence runs '+fw+' words. Open with the answer in 22 or fewer.'},
    {ok:avg<=16&&longest<=25,label:'Short sentences',tip:'Average '+avg.toFixed(1)+' words, longest '+longest+'. Split anything over 25.'},
    {ok:per100<=3,label:'Few filler words',tip:f.total+' found ('+list+'). Replace each with a pause.'},
    {ok:spec>=2||storyish(text),label:'Concrete detail',tip:'Add numbers, names, or days. Two or more in a minute makes it sound real.'}
  ];
  return {needsPunct:false,wc:wc,ss:ss,avg:avg,longest:longest,longestText:longestText,per100:per100,fillers:f.total,by:f.by,spec:spec,checks:checks};
}
function dstr(d){var p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function streakOf(days,today){
  var a=today.split('-').map(Number),dt=new Date(a[0],a[1]-1,a[2]),n=0;
  if(!days[dstr(dt)])dt.setDate(dt.getDate()-1);
  while(days[dstr(dt)]){n++;dt.setDate(dt.getDate()-1)}
  return n;
}
function xpAt(l){return 20*l*(l-1)}
function levelOf(xp){var l=1;while(xp>=xpAt(l+1))l++;return l}

function checkPRE(p,r,e){

function checkClean(text,item){
  var wc=words(text).length,fl=fillerStats(text),vg=vagueList(text),low=text.toLowerCase();
  var hit=item.facts.filter(function(f){return new RegExp(f,'i').test(low)}).length;

function parseTap(str){return str.split(/\s+/).map(function(w){var m=w.match(/^\*(.+?)\*(.*)$/);return m?{w:m[1]+m[2],bad:true}:{w:w,bad:false}})}
function startLesson(id){
  var f=lessonById(id);
  LS={id:id,f:f,queue:f.l.steps.map(function(s){return {s:s,retry:false}}),pos:0,done:0,base:f.l.steps.length,xp:0,first:0,scored:0,miss:0,cg:0,ct:0,sx:null};
  loadStep();
}
function loadStep(){
  var q=LS.queue[LS.pos],s=q.s,x={checked:false,final:false,awarded:false};
  if(s.t==='mc'){x.perm=shuffle(s.opts.length);x.sel=-1}
  else if(s.t==='order'){x.perm=shuffle(s.items.length);if(x.perm.every(function(n,i){return n===i}))x.perm.reverse();x.placed=[]}
  else if(s.t==='tap'){x.toks=parseTap(s.text);x.sel={}}
  LS.sx=x;
}
function gain(n){addXP(n);LS.xp+=n}
function hintHTML(s){return s.hint?'<details class="hintbox"><summary>Need a hint?</summary><p>'+esc(s.hint)+'</p></details>':''}
function bodyHTML(){
  var s=LS.queue[LS.pos].s,x=LS.sx,h='';
  if(s.t==='teach'){
    h='<div class="teach"><span class="eyebrow">New idea</span><h2 class="ltitle">'+esc(s.title)+'</h2><div class="tcard">'+s.lines.map(function(p){return '<p>'+esc(p)+'</p>'}).join('')+'</div>'+
      (s.eg?s.eg.map(function(e){return '<div class="eg'+(e[0]==='b'?' bad':'')+'"><b>'+esc(e[1])+'</b>'+esc(e[2])+'</div>'}).join(''):'')+'</div>';
  }else if(s.t==='mc'){
    h='<h2 class="ltitle">'+esc(s.q)+'</h2>';
    if(s.ctx)h+='<div class="ctx"><b>'+esc(s.ctxL||'Situation')+'</b>'+esc(s.ctx)+'</div>';
    if(s.sent){
      var chosen=x.sel>=0?esc(s.opts[x.perm[x.sel]]):'&nbsp;';
      h+='<p class="sent">'+esc(s.sent).replace('___',function(){return '<span class="blank">'+chosen+'</span>'})+'</p>';
    }
    h+='<div class="opts">'+x.perm.map(function(oi,pos){
      var cls='opt';
      if(x.checked){if(oi===0)cls+=' ok';else if(pos===x.sel)cls+=' no'}
      else if(pos===x.sel)cls+=' sel';
      return '<button class="'+cls+'" data-action="pick" data-i="'+pos+'" aria-pressed="'+(pos===x.sel)+'"'+(x.checked?' disabled':'')+'><span class="k">'+String.fromCharCode(65+pos)+'</span><span>'+esc(s.opts[oi])+'</span></button>';
    }).join('')+'</div>';
  }else if(s.t==='order'){
    h='<h2 class="ltitle">'+esc(s.q)+'</h2><p class="hint">Tap the lines in the right order. Tap a placed line to take it back.</p><ol class="slots">';
    for(var i=0;i<s.items.length;i++){
      var it=x.placed[i];
      var inner=it===undefined?'':'<button class="opt'+(x.checked?(it===i?' ok':' no'):'')+'" data-action="unplace" data-i="'+i+'"'+(x.checked?' disabled':'')+'><span>'+esc(s.items[it])+'</span></button>';
      h+='<li class="slot"><span class="sn">'+(i+1)+'</span>'+inner+'</li>';
    }
    h+='</ol>';
    if(!x.checked)h+='<div class="pool">'+x.perm.filter(function(ix){return x.placed.indexOf(ix)<0}).map(function(ix){return '<button class="opt" data-action="place" data-i="'+ix+'"><span>'+esc(s.items[ix])+'</span></button>'}).join('')+'</div>';
  }else if(s.t==='tap'){
    h='<h2 class="ltitle">'+esc(s.q)+'</h2><p class="hint">Tap every one, then check.</p><div class="toks">'+x.toks.map(function(t,i){
      var cls='tok',sel=!!x.sel[i];
      if(x.checked){if(t.bad&&sel)cls+=' ok';else if(t.bad)cls+=' miss';else if(sel)cls+=' no'}
      else if(sel)cls+=' sel';
      return '<button class="'+cls+'" data-action="tok" data-i="'+i+'" aria-pressed="'+sel+'"'+(x.checked?' disabled':'')+'>'+esc(t.w)+'</button>';
    }).join('')+'</div>';
  }else if(s.t==='tp'||s.t==='tpr'||s.t==='tpre'){
    h='<span class="eyebrow">Write it</span><h2 class="ltitle">'+esc(s.q)+'</h2>'+hintHTML(s)+field('t-p','Your point','One sentence. Start with the answer.',2);
    if(s.t!=='tp')h+=field('t-r','Your reason','One sentence. Say why.',2);
    if(s.t==='tpre')h+=field('t-e','Example (optional)','Skip it, or add a number, a name, or a day.',3);
    h+='<div id="warn"></div>';
  }else if(s.t==='tun'){
    h='<span class="eyebrow">Write it</span><h2 class="ltitle">Fix the tangled sentence</h2><p>Rewrite this as short sentences. Keep every fact. Cut the filler.</p><blockquote class="tangle">'+esc(s.item.text)+'</blockquote>'+field('un-text','Your rewrite','Each sentence 16 words or fewer, with at most one comma.',5)+'<div id="warn"></div>';
  }else if(s.t==='tcl'){
    h='<span class="eyebrow">Write it</span><h2 class="ltitle">Say it clean</h2><p>Rewrite this with no filler. Keep the meaning.</p><blockquote class="tangle">'+esc(s.text)+'</blockquote>'+field('cl-text','Your rewrite','One short sentence.',2)+'<div id="warn"></div>';
  }else if(s.t==='speak'){
    h='<span class="eyebrow">Speak it</span><h2 class="ltitle">Say it out loud</h2>'+speakHTML(s.q)+'<div id="warn"></div>';
  }
  return h;
}
function footHTML(){
  var s=LS.queue[LS.pos].s,x=LS.sx;
  if(s.t==='teach')return '<button class="btn" data-action="gotit">Got it</button>';
  var ready=true;
  if(s.t==='mc')ready=x.sel>=0;
  else if(s.t==='order')ready=x.placed.length===s.items.length;
  else if(s.t==='tap')ready=Object.keys(x.sel).some(function(k){return x.sel[k]});
  return '<button class="btn" data-action="lcheck"'+(ready?'':' disabled')+'>Check</button>';
}
function paintStep(){$('#stepbody').innerHTML=bodyHTML();$('#lfoot').innerHTML=footHTML()}
function lessonHTML(){
  var pct=Math.min(100,LS.done/LS.base*100);
  return '<div class="lhead"><div class="ltop"><button class="quit" data-action="quit" aria-label="Quit lesson">'+ico('x',16)+'<span>Exit</span></button><div class="prog" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="'+LS.base+'" aria-valuenow="'+LS.done+'"><i style="width:'+pct+'%"></i></div></div><p class="eyebrow">Unit '+LS.f.u.n+' · '+esc(LS.f.l.title)+'</p></div>'+
    '<div id="stepbody" class="stepbody"></div><div id="fb"></div><div id="lfoot" class="lfoot"></div>';
}
function updateProg(){
  var p=$('.prog'),i=$('.prog i');
  if(i)i.style.width=Math.min(100,LS.done/LS.base*100)+'%';
  if(p)p.setAttribute('aria-valuenow',LS.done);
}
function showSheet(tone,head,xp,inner,again,label){
  var fb=$('#fb');
  fb.innerHTML=fbHTML(tone,head,xp,inner,'');
  $('#lfoot').innerHTML='<div class="frow">'+(again?'<button class="btn ghost" data-action="lretry">Try again</button>':'')+'<button class="btn" data-action="lnext">'+label+'</button></div>';
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function hideSheet(){
  var fb=$('#fb');if(fb)fb.innerHTML='';
  var lf=$('#lfoot');if(lf&&LS)lf.innerHTML=footHTML();
}
function isLast(){return LS.pos>=LS.queue.length-1}

function resolveChoice(ok,correctHTML,why){
  var q=LS.queue[LS.pos],s=q.s,x=LS.sx,xp=0;
  x.checked=true;
  if(!q.retry){
    LS.scored++;
    if(ok){LS.first++;xp=5;gain(5)}
    else{LS.miss++;LS.queue.push({s:s,retry:true})}
  }
  x.final=ok||q.retry;
  if(x.final){LS.done++;updateProg()}
  save();flushToast();
  $('#stepbody').innerHTML=bodyHTML();
  var inner=(ok?'':'<p><b>Correct answer:</b></p>'+correctHTML)+(why?'<p>'+esc(why)+'</p>':'');
  showSheet(ok?'good':'bad',ok?rnd(PRAISE):(q.retry?'Not quite. Moving on.':'Not quite'),xp,inner,false,isLast()&&x.final?'Finish':'Continue');
}
function checkChoice(){
  var s=LS.queue[LS.pos].s,x=LS.sx,ok,correct='',why=s.why;
  if(s.t==='mc'){
    ok=x.perm[x.sel]===0;correct='<p>'+esc(s.opts[0])+'</p>';
  }else if(s.t==='order'){
    ok=x.placed.every(function(n,i){return n===i});
    correct='<ol>'+s.items.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ol>';
  }else{
    ok=x.toks.every(function(t,i){return !!x.sel[i]===t.bad});
    var bad=x.toks.filter(function(t){return t.bad}).map(function(t){return t.w.replace(/[.,!?]+$/,'')});
    correct='<p>'+esc(bad.join(', '))+'</p>';
    why='Try it like this: '+s.clean;
    if(ok)why='Cleaner version: '+s.clean;
  }
  resolveChoice(ok,correct,why);
}
function checkTyped(){
  var q=LS.queue[LS.pos],s=q.s,x=LS.sx,checks,model='',extra='',talk=null,per=4,bonus=6;
  var wr=$('#warn');wr.innerHTML='';
  function bail(m){wr.innerHTML=warnHTML(m)}
  if(s.t==='tp'){
    var p=v('t-p');if(!p){bail('Write your point first, then check.');return}
    checks=checkPointOnly(p);model='<p><b>Sample.</b> '+esc(s.sample.p)+'</p>';
  }else if(s.t==='tpr'||s.t==='tpre'){
    var p2=v('t-p'),r2=v('t-r'),e2=s.t==='tpre'?v('t-e'):'';
    if(!p2||!r2){bail('Fill in your point and your reason, then check.');return}
    checks=checkPRE(p2,r2,e2);
    model='<p><b>Point.</b> '+esc(s.sample.p)+'</p><p><b>Reason.</b> '+esc(s.sample.r)+'</p>'+(s.sample.e?'<p><b>Example.</b> '+esc(s.sample.e)+'</p>':'');
    if(s.t==='tpre'&&!e2)extra='<p class="tip">You skipped the optional example. Add one when you have a real moment for bonus XP.</p>';
  }else if(s.t==='tun'){
    var u=v('un-text');if(!u){bail('Write your rewrite first, then check.');return}
    checks=checkUntangle(u,s.item);model='<p>'+esc(s.item.model)+'</p><p class="tip">Other good rewrites exist. Compare the sentence lengths.</p>';
  }else if(s.t==='tcl'){
    var c=v('cl-text');if(!c){bail('Write your rewrite first, then check.');return}
    checks=checkClean(c,s);model='<p>'+esc(s.model)+'</p>';
  }else{
    var tx=v('say-text');
    if(words(tx).length<5){bail('Add what you said first. Dictate with your keyboard mic or type it up from a recording.');return}
    var a=analyzeTalk(tx);
    if(a.needsPunct){bail('Your text has '+a.wc+' words and no periods. Add a period wherever you paused, then check again. Finding those breaks is part of the exercise.');return}
    checks=a.checks;per=8;bonus=10;talk=a;extra=talkExtra(a);
    model='<p>Open with the point in one sentence. Give the reason. Then one example with a number or a name. Pause between sentences instead of saying "um".</p>';
  }
  var got=checks.filter(function(k){return k.ok}).length,all=got===checks.length,first=!x.awarded,xp=0;
  if(first){
    x.awarded=true;x.final=true;
    xp=got*per+(all?bonus:0);gain(xp);
    LS.cg+=got;LS.ct+=checks.length;LS.done++;updateProg();
    if(talk){S.talk.push({d:todayStr(),per100:talk.per100,avg:talk.avg,words:talk.wc});S.talk=S.talk.slice(-12);checkBadges(ctxNow(talk))}
    save();flushToast();
  }
  var ratio=got/checks.length,tone=all?'good':(ratio>=0.6?'mid':'bad');
  var head=all?rnd(PRAISE):(tone==='mid'?'Almost there':'Let us tighten it');
  showSheet(tone,head,first?xp:0,'<p><b>'+got+' of '+checks.length+' checks passed.</b>'+(first?'':' Re-check: no extra XP.')+'</p>'+checksHTML(checks)+extra+'<details><summary>See a sample answer</summary>'+model+'</details>',true,isLast()?'Finish':'Continue');
}
function advanceLesson(){
  LS.pos++;
  if(LS.pos>=LS.queue.length){finishLesson();return}
  loadStep();go({name:'lesson'});
}
function finishLesson(){
  var bonus=20+(LS.miss===0?10:0);
  gain(bonus);
  S.lessons[LS.id]=1;S.done+=1;if(LS.miss===0)S.perfect+=1;
  markDay();checkBadges(ctxNow(null));
  save();flushToast();
  go({name:'ldone'});
}
function ldoneHTML(){
  var den=LS.scored+LS.ct,acc=den?Math.round((LS.first+LS.cg)/den*100):100,st=streakOf(S.days,todayStr());
  var nxt=ALL[LS.f.i+1];
  return '<div class="done"><span class="eyebrow">Unit '+LS.f.u.n+' · '+esc(LS.f.l.title)+'</span><h1><span class="hl">Lesson</span> complete</h1>'+
    strip([['XP earned',LS.xp],['Accuracy',acc+'%'],['Day streak',st]])+
    '<div class="btns col2">'+(nxt?'<button class="btn" data-action="lesson" data-id="'+nxt.l.id+'">Next lesson</button><button class="btn ghost" data-action="home">Back to path</button>':'<button class="btn" data-action="home">Back to path</button>')+'</div></div>';
}

// ---------- free practice drills ----------
function pickItem(s){
  var arr=DECK[s.kind],i;
  do{i=Math.floor(Math.random()*arr.length)}while(s.used.indexOf(i)>=0&&s.used.length<arr.length);
  s.used.push(i);
  return arr[i];
}
function startSession(kind){
  cur={kind:kind,rounds:drillOf(kind).rounds,round:1,used:[],xp:0,got:0,total:0,awarded:false};
  cur.item=pickItem(cur);
}
function awardDrill(kind,checks,per,bonus,talk){
  var got=checks.filter(function(c){return c.ok}).length,all=got===checks.length;
  var xp=got*per+(all?bonus:0);
  addXP(xp);markDay();
  S.done+=1;S.kinds[kind]=1;if(all)S.perfect+=1;
  if(talk){S.talk.push({d:todayStr(),per100:talk.per100,avg:talk.avg,words:talk.wc});S.talk=S.talk.slice(-12)}
  checkBadges(ctxNow(talk));
  save();flushToast();
  return xp;
}
function drillHTML(){
  var k=cur.kind,it=cur.item,d=drillOf(k),pct=(cur.round-1)/cur.rounds*100;
  var top='<div class="lhead"><div class="ltop"><button class="quit" data-action="home" aria-label="Quit practice">'+ico('x',16)+'<span>Exit</span></button><div class="prog" role="progressbar" aria-label="Practice progress" aria-valuemin="0" aria-valuemax="'+cur.rounds+'" aria-valuenow="'+(cur.round-1)+'"><i style="width:'+pct+'%"></i></div><span class="rc">'+cur.round+'/'+cur.rounds+'</span></div>'+
    '<p class="eyebrow">Free practice · '+esc(it.tag)+'</p></div><h2 class="ltitle">'+d.title+'</h2>';
  var body='';
  if(k==='point'){
    body='<p style="font-size:1.25rem;font-weight:800">'+esc(it.q)+'</p>'+
      field('pf-point','Point','The answer in one sentence. Say it before you explain it.',2)+
      field('pf-reason','Reason','Why is that true? One sentence.',2)+
      field('pf-example','Example (optional)','Skip it, or add a number, a name, or a day for bonus points.',3)+
      '<div class="btns"><button class="btn" data-action="check">Check</button></div>';
  }else if(k==='untangle'){
    body='<p>Rewrite this as short sentences. Keep every fact. Cut the filler.</p><blockquote class="tangle">'+esc(it.text)+'</blockquote>'+
      field('un-text','Your rewrite','Each sentence 16 words or fewer, with at most one comma.',5)+
      '<div class="btns"><button class="btn" data-action="check">Check</button></div>';
  }else if(k==='concrete'){
    body='<p>This sentence is vague. Rewrite it so a listener could picture it.</p><blockquote class="tangle">'+esc(it.text)+'</blockquote><p><b>Your job:</b> '+esc(it.ask)+'</p>'+
      field('cn-text','Your rewrite','One or two sentences.',3)+
      '<div class="btns"><button class="btn" data-action="check">Check</button></div>';
  }else{
    body=speakHTML(it.q)+'<div class="btns"><button class="btn" data-action="check">Check</button></div>';
  }
  return top+body+'<div id="result"></div><div id="fb"></div>';
}
function runCheck(){
  var k=cur.kind,it=cur.item,out=$('#result'),checks,per,bonus,model,extra='',talk=null;
  out.innerHTML='';
  if(k==='point'){
    var p=v('pf-point'),r=v('pf-reason'),e=v('pf-example');
    if(!p||!r){out.innerHTML=warnHTML('Fill in your point and your reason, then check. The example is optional.');return}
    checks=checkPRE(p,r,e);per=5;bonus=10;
    model='<p><b>Point.</b> '+esc(it.m.p)+'</p><p><b>Reason.</b> '+esc(it.m.r)+'</p><p><b>Example.</b> '+esc(it.m.e)+'</p><p class="tip">Yours can be completely different. The shape is what matters.</p>';
    if(!e)extra='<p class="tip">You skipped the optional example. Add one when you have a real moment.</p>';
  }else if(k==='untangle'){
    var u=v('un-text');
    if(!u){out.innerHTML=warnHTML('Write your rewrite first, then check.');return}
    checks=checkUntangle(u,it);per=4;bonus=10;
    model='<p>'+esc(it.model)+'</p><p class="tip">Other good rewrites exist. Compare the sentence lengths.</p>';
  }else if(k==='concrete'){
    var c=v('cn-text');
    if(!c){out.innerHTML=warnHTML('Write your rewrite first, then check.');return}
    checks=checkConcrete(c,it);per=5;bonus=10;
    model='<p>'+esc(it.model)+'</p><p class="tip">Use your own real numbers and names.</p>';
  }else{
    var tx=v('say-text');
    if(words(tx).length<5){out.innerHTML=warnHTML('Add what you said first. Dictate with your keyboard mic or type it up from a recording.');return}
    var a=analyzeTalk(tx);
    if(a.needsPunct){out.innerHTML=warnHTML('Your text has '+a.wc+' words and no periods. Add a period wherever you paused, then check again. Finding those breaks is part of the exercise.');return}
    checks=a.checks;per=8;bonus=10;talk=a;extra=talkExtra(a);
    model='<p>Open with the point in one sentence. Give the reason. Then one example with a number or a name. Pause between sentences instead of saying "um".</p>';
  }
  var first=!cur.awarded,xp=0,got=checks.filter(function(x){return x.ok}).length;
  if(first){
    xp=awardDrill(k,checks,per,bonus,talk);cur.awarded=true;cur.xp+=xp;cur.got+=got;cur.total+=checks.length;
    var bar=$('.prog i');if(bar)bar.style.width=(cur.round/cur.rounds*100)+'%';
  }
  var ratio=got/checks.length,tone=got===checks.length?'good':(ratio>=0.6?'mid':'bad');
  var head={good:'Perfect',mid:'Almost there',bad:'Let us tighten it'}[tone];
  var last=cur.round>=cur.rounds;
  var inner='<p><b>'+got+' of '+checks.length+' checks passed.</b>'+(first?'':' Re-check: no extra XP.')+'</p>'+checksHTML(checks)+extra+'<details><summary>See a model answer</summary>'+model+'</details>';
  var btns='<div class="btns"><button class="btn ghost" data-action="retry">Try again</button><button class="btn" data-action="advance">'+(last?'Finish':'Continue')+'</button></div>';
  var fb=$('#fb');
  fb.innerHTML=fbHTML(tone,head,first?xp:0,inner,btns);
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function advanceDrill(){
  if(cur.round<cur.rounds){cur.round++;cur.item=pickItem(cur);cur.awarded=false;go({name:'drill'})}
  else go({name:'done'});
}
function doneHTML(){
  var acc=cur.total?Math.round(cur.got/cur.total*100):0;
  return '<div class="done"><span class="eyebrow">Free practice · '+drillOf(cur.kind).name+'</span><h1><span class="hl">Practice</span> complete</h1>'+
    strip([['Total XP',cur.xp],['Checks passed',acc+'%'],['Rounds',cur.rounds]])+
    '<div class="btns col2"><button class="btn" data-action="home">Continue</button><button class="btn ghost" data-action="open" data-kind="'+cur.kind+'">Practice again</button></div></div>';
}

// ---------- shell ----------
function render(){
  var app=$('#app'),n=view.name;
  app.classList.toggle('lesson',n==='lesson');
  document.body.classList.toggle('inlesson',n==='lesson');
  app.innerHTML=n==='home'?homeHTML():(n==='done'?doneHTML():(n==='ldone'?ldoneHTML():(n==='lesson'?lessonHTML():drillHTML())));
  if(n==='lesson')paintStep();
}
function go(vw){stopTimer();view=vw;render();window.scrollTo(0,0)}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-action]');if(!b)return;
  var a=b.dataset.action,x=LS&&LS.sx,s;
  if(a==='home')go({name:'home'});
  else if(a==='open'){startSession(b.dataset.kind);go({name:'drill'})}
  else if(a==='advance')advanceDrill();
  else if(a==='check')runCheck();
  else if(a==='timer')toggleTimer();
  else if(a==='retry'){
    var fb=$('#fb');if(fb)fb.innerHTML='';
    var ta=document.querySelector('textarea');if(ta){ta.scrollIntoView({behavior:'smooth',block:'center'});ta.focus()}
  }
  else if(a==='lesson'){
    var f=lessonById(b.dataset.id);
    if(!f)return;
    if(lessonState(f.i)==='lock'){toast('Finish the lesson before it to unlock this one.');return}
    startLesson(b.dataset.id);go({name:'lesson'});
  }
  else if(a==='gotit'){LS.done++;advanceLesson()}
  else if(a==='pick'){if(x&&!x.checked){x.sel=+b.dataset.i;paintStep()}}
  else if(a==='place'){if(x&&!x.checked){x.placed.push(+b.dataset.i);paintStep()}}
  else if(a==='unplace'){if(x&&!x.checked){x.placed.splice(+b.dataset.i,1);paintStep()}}
  else if(a==='tok'){if(x&&!x.checked){var i=+b.dataset.i;x.sel[i]=!x.sel[i];paintStep()}}
  else if(a==='lcheck'){
    s=LS.queue[LS.pos].s;
    if(s.t==='mc'||s.t==='order'||s.t==='tap')checkChoice();else checkTyped();
  }
  else if(a==='lnext'){hideSheet();advanceLesson()}
  else if(a==='lretry'){
    hideSheet();
    var t2=document.querySelector('#stepbody textarea');if(t2){t2.scrollIntoView({behavior:'smooth',block:'center'});t2.focus()}
  }
  else if(a==='quit'){
    if(LS&&(LS.done>0||LS.xp>0)&&!armedQuit){armedQuit=true;toast('Tap Exit again to quit. Progress in this lesson will be lost.');setTimeout(function(){armedQuit=false},3500)}
    else{armedQuit=false;go({name:'home'})}
  }
  else if(a==='reset'){
    if(!armed){armed=true;b.textContent='Tap again to erase everything';setTimeout(function(){armed=false;var rb=$('#resetBtn');if(rb)rb.textContent='Reset progress'},4000)}
    else{armed=false;S=blank();save();render();toast('Progress erased')}
  }
});
render();
</script>

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
